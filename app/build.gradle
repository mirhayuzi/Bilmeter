plugins { id 'com.android.application' }

android {
    namespace 'com.rumah.bilelektrik'
    compileSdk 35

    defaultConfig {
        applicationId 'com.rumah.bilelektrik'
        minSdk 23
        targetSdk 34
        versionCode 2
        versionName '2.0-OCR'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Bundled on-device Latin text recognition: usable offline after APK install.
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation 'androidx.core:core:1.13.1'
}

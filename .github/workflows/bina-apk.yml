name: Bina APK Android Percuma
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Setup Node.js for calculation tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test calculations and OCR parser
        run: node tests/test_logic.js
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          cache-disabled: true
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - name: Install Android API 35
        run: sdkmanager "platforms;android-35" "build-tools;34.0.0"
      - name: Build installable debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload APK as GitHub Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bil-Elektrik-3-Rumah-OCR-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 3
